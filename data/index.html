<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EspressiScale OTA</title>
  <style>
    :root {
      --bg: #0f0f10;
      --panel: #171719;
      --panel-border: #2a2a2f;
      --text: #f2eee7;
      --muted: #b8b0a5;
      --accent: #c8a26a;
      --accent-hover: #d4b282;
      --danger: #ff7b7b;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 0%, rgba(200, 162, 106, 0.12), transparent 38%),
        radial-gradient(circle at 95% 90%, rgba(200, 162, 106, 0.09), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }

    .card {
      width: min(460px, 100%);
      background: linear-gradient(180deg, #1a1a1d 0%, #141416 100%);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      padding: 2rem;
    }

    .brand {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
    }

    h1 {
      margin: 0.35rem 0 1.5rem;
      font-size: 1.9rem;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .controls {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      padding: 0.8rem 1.15rem;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(200, 162, 106, 0.22);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border-color: #44434c;
      box-shadow: none;
    }

    .btn.ghost:hover {
      background: #232328;
    }

    .note {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0.75rem 0 0;
    }

    .error {
      color: var(--danger);
    }

    .inline {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 1.4rem;
    }

    label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
    }

    select {
      width: 100%;
      border-radius: 999px;
      border: 1px solid #3a3942;
      background: #101012;
      color: var(--text);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      outline: none;
    }

    #updateSection {
      margin-top: 1rem;
      border-radius: 14px;
      border: 1px solid #3b3125;
      background: rgba(200, 162, 106, 0.09);
      padding: 0.9rem;
    }

    #updateSection p {
      margin: 0 0 0.75rem;
      color: #f0dcc0;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">EspressiScale</p>
    <h1>OTA Firmware</h1>

    <p class="note" id="versionText">Version: Loading...</p>

    <div class="controls">
      <button id="checkBtn" class="btn">Check for update</button>
      <button id="forceBtn" class="btn ghost">Force update</button>
      <button class="btn ghost" onclick="window.location.href='/calibrate'">Calibration</button>
    </div>

    <div id="updateSection" style="display:none;">
      <p>New version available: <strong id="newVersion"></strong></p>
      <button id="updateBtn" class="btn">Update now</button>
    </div>

    <div id="message" class="note"></div>

    <div class="inline">
      <label for="channelSelect">Release channel</label>
      <select id="channelSelect">
        <option value="stable">Stable</option>
        <option value="beta">Beta</option>
      </select>
    </div>
  </div>

  <script>
    function compareVersions(v1, v2) {
      const a = v1.split('.').map(n => parseInt(n, 10));
      const b = v2.split('.').map(n => parseInt(n, 10));
      const len = Math.max(a.length, b.length);
      for (let i = 0; i < len; i++) {
        const n1 = a[i] || 0;
        const n2 = b[i] || 0;
        if (n1 > n2) return 1;
        if (n1 < n2) return -1;
      }
      return 0;
    }

    fetch('/getFW')
      .then(r => r.text())
      .then(v => {
        window.FW_VERSION = v.trim();
        document.getElementById('versionText').textContent = 'Version: ' + window.FW_VERSION;
      })
      .catch(() => {
        window.FW_VERSION = null;
        document.getElementById('versionText').textContent = 'Error loading version';
      });

    const channelSelect = document.getElementById('channelSelect');
    const checkBtn = document.getElementById('checkBtn');
    const forceBtn = document.getElementById('forceBtn');
    const updateBtn = document.getElementById('updateBtn');
    const updateSect = document.getElementById('updateSection');
    const newVerEl = document.getElementById('newVersion');
    const messageEl = document.getElementById('message');

    function getSuffix() {
      return channelSelect.value === 'beta' ? 'Beta' : '';
    }

    function resetUI() {
      messageEl.textContent = '';
      messageEl.classList.remove('error');
      updateSect.style.display = 'none';
      updateBtn.disabled = false;
      updateBtn.textContent = 'Update now';
    }

    async function performUpdate() {
      resetUI();
      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating…';
      const suffix = getSuffix();
      try {
        const res = await fetch(`/updateRemote${suffix}`);
        if (res.ok) {
          messageEl.textContent = 'Update succeeded; device is rebooting…';
        } else {
          throw new Error(await res.text());
        }
      } catch (err) {
        messageEl.textContent = 'Update failed: ' + err.message;
        messageEl.classList.add('error');
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update now';
      }
    }

    checkBtn.addEventListener('click', async () => {
      resetUI();
      checkBtn.disabled = true;
      checkBtn.textContent = 'Checking…';
      const suffix = getSuffix();
      try {
        const res = await fetch(`/checkRemote${suffix}`);
        if (!res.ok) throw new Error(res.statusText);
        const latest = (await res.text()).trim();
        const cmp = window.FW_VERSION ? compareVersions(latest, window.FW_VERSION) : 1;
        if (cmp <= 0) {
          messageEl.textContent = 'Already on the latest firmware.';
        } else {
          newVerEl.textContent = latest;
          updateSect.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = 'Error checking update: ' + err.message;
        messageEl.classList.add('error');
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check for update';
      }
    });

    forceBtn.addEventListener('click', () => {
      resetUI();
      if (confirm('Please stay on this page during the update process. \n\n' +
                  'Force install the latest version?')) {
        newVerEl.textContent = 'latest';
        updateSect.style.display = 'block';
        performUpdate();
      }
    });

    updateBtn.addEventListener('click', () => {
      if (confirm('Please stay on this page during the update process.\n\n' +
                  'Update to version ' + newVerEl.textContent + '?')) {
        performUpdate();
      }
    });
  </script>
</body>
</html>
