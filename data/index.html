<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EspressiScale OTA</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/alpenkreuzer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* brewflow-ble coffee design language */
      --background: hsl(25 25% 8%);
      --card: hsl(25 20% 12%);
      --card-border: hsl(25 25% 20%);
      --foreground: hsl(0 0% 100%);
      --muted-foreground: hsl(0 0% 80%);
      --primary: hsl(25 40% 25%);
      --accent: hsl(20 85% 60%);
      --accent-soft: hsl(20 85% 60% / 0.18);
      --espresso: hsl(25 30% 5%);
      --danger: hsl(0 75% 55%);
      --radius: 0.75rem;
      --shadow-soft: 0 4px 20px hsl(0 0% 0% / 0.4);
      --shadow-scale: 0 8px 40px hsl(0 0% 0% / 0.5);
      --shadow-glow: 0 0 30px hsl(20 85% 60% / 0.4);
      --transition-spring: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 0%, hsl(20 85% 60% / 0.12), transparent 38%),
        radial-gradient(circle at 95% 90%, hsl(20 85% 60% / 0.09), transparent 35%),
        var(--background);
      color: var(--foreground);
      font-family: "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }

    .card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: calc(var(--radius) * 1.5);
      box-shadow: var(--shadow-scale);
      padding: 2rem;
    }

    .brand {
      margin: 0;
      color: var(--muted-foreground);
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      font-family: "Alpenkreuzer", "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    h1 {
      margin: 0.35rem 0 1.5rem;
      font-size: 3rem;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .controls {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--accent);
      color: var(--espresso);
      padding: 0.8rem 1.15rem;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-spring);
      box-shadow: var(--shadow-soft);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--foreground);
      border-color: var(--card-border);
      box-shadow: none;
    }

    .btn.ghost:hover {
      background: hsl(25 25% 16%);
      box-shadow: none;
    }

    .note {
      color: var(--muted-foreground);
      font-size: 0.9rem;
      margin: 0.75rem 0 0;
    }

    .error { color: var(--danger); }

    .inline {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 1.4rem;
    }

    label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted-foreground);
      font-weight: 600;
    }

    select {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--espresso);
      color: var(--foreground);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      outline: none;
    }

    #updateSection {
      margin-top: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      background: var(--accent-soft);
      padding: 0.9rem;
    }

    #updateSection p {
      margin: 0 0 0.75rem;
      color: var(--foreground);
    }

    /* Progress UI */
    #progressSection {
      margin-top: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      background: var(--espresso);
      padding: 1rem;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
      gap: 1rem;
    }

    .stage-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--foreground);
    }

    .percent-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: hsl(25 25% 20%);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 12px hsl(20 85% 60% / 0.6);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">EspressiScale</p>
    <h1>OTA Firmware</h1>

    <p class="note" id="versionText">Version: Loading...</p>

    <div class="controls">
      <button id="checkBtn" class="btn">Check for update</button>
      <button id="forceBtn" class="btn ghost">Force update</button>
      <button class="btn ghost" onclick="window.location.href='/calibrate'">Calibration</button>
    </div>

    <div id="updateSection" style="display:none;">
      <p>New version available: <strong id="newVersion"></strong></p>
      <button id="updateBtn" class="btn">Update now</button>
    </div>

    <div id="progressSection" style="display:none;">
      <div class="progress-head">
        <span class="stage-label" id="stageLabel">Starting…</span>
        <span class="percent-label" id="percentLabel">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div id="message" class="note"></div>

    <div class="inline">
      <label for="channelSelect">Release channel</label>
      <select id="channelSelect">
        <option value="stable">Stable</option>
        <option value="beta">Beta</option>
      </select>
    </div>
  </div>

  <script>
    function compareVersions(v1, v2) {
      const a = v1.split('.').map(n => parseInt(n, 10));
      const b = v2.split('.').map(n => parseInt(n, 10));
      const len = Math.max(a.length, b.length);
      for (let i = 0; i < len; i++) {
        const n1 = a[i] || 0;
        const n2 = b[i] || 0;
        if (n1 > n2) return 1;
        if (n1 < n2) return -1;
      }
      return 0;
    }

    fetch('/getFW')
      .then(r => r.text())
      .then(v => {
        window.FW_VERSION = v.trim();
        document.getElementById('versionText').textContent = 'Version: ' + window.FW_VERSION;
      })
      .catch(() => {
        window.FW_VERSION = null;
        document.getElementById('versionText').textContent = 'Error loading version';
      });

    const channelSelect = document.getElementById('channelSelect');
    const checkBtn = document.getElementById('checkBtn');
    const forceBtn = document.getElementById('forceBtn');
    const updateBtn = document.getElementById('updateBtn');
    const updateSect = document.getElementById('updateSection');
    const progressSect = document.getElementById('progressSection');
    const stageLabel = document.getElementById('stageLabel');
    const percentLabel = document.getElementById('percentLabel');
    const progressFill = document.getElementById('progressFill');
    const newVerEl = document.getElementById('newVersion');
    const messageEl = document.getElementById('message');

    const STAGE_LABELS = {
      'idle':            'Idle',
      'downloading-fs':  'Downloading filesystem…',
      'installing-fs':   'Installing filesystem…',
      'downloading-fw':  'Downloading firmware…',
      'installing-fw':   'Installing firmware…',
      'rebooting':       'Rebooting…',
      'error':           'Update failed'
    };

    function getSuffix() {
      return channelSelect.value === 'beta' ? 'Beta' : '';
    }

    function resetUI() {
      messageEl.textContent = '';
      messageEl.classList.remove('error');
      updateSect.style.display = 'none';
      progressSect.style.display = 'none';
      updateBtn.disabled = false;
      updateBtn.textContent = 'Update now';
    }

    function showProgress(stage, percent) {
      progressSect.style.display = 'block';
      stageLabel.textContent = STAGE_LABELS[stage] || stage;
      const p = Math.max(0, Math.min(100, percent | 0));
      percentLabel.textContent = p + '%';
      progressFill.style.width = p + '%';
    }

    let pollTimer = null;
    let lastPercent = 0;
    let sawProgress = false;

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function pollProgress() {
      try {
        const res = await fetch('/updateProgress', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        lastPercent = data.percent || 0;
        sawProgress = sawProgress || lastPercent > 0;
        showProgress(data.stage, lastPercent);

        if (data.stage === 'rebooting') {
          stopPolling();
          messageEl.textContent = 'Device is rebooting — reconnect in a moment.';
        } else if (data.stage === 'error') {
          stopPolling();
          messageEl.textContent = 'Update failed: ' + (data.error || 'unknown error');
          messageEl.classList.add('error');
          updateBtn.disabled = false;
          updateBtn.textContent = 'Update now';
        }
      } catch (err) {
        // Likely lost connection because the device is rebooting.
        if (sawProgress && lastPercent >= 95) {
          stopPolling();
          showProgress('rebooting', 100);
          messageEl.textContent = 'Device is rebooting — reconnect in a moment.';
        }
        // otherwise keep polling, transient error
      }
    }

    async function performUpdate() {
      resetUI();
      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating…';
      showProgress('downloading-fs', 0);
      lastPercent = 0;
      sawProgress = false;
      const suffix = getSuffix();
      try {
        const res = await fetch(`/updateRemote${suffix}`);
        if (!res.ok && res.status !== 202) {
          throw new Error(await res.text());
        }
        // Start polling for progress
        stopPolling();
        pollTimer = setInterval(pollProgress, 500);
        pollProgress();
      } catch (err) {
        messageEl.textContent = 'Update failed: ' + err.message;
        messageEl.classList.add('error');
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update now';
        progressSect.style.display = 'none';
      }
    }

    checkBtn.addEventListener('click', async () => {
      resetUI();
      checkBtn.disabled = true;
      checkBtn.textContent = 'Checking…';
      const suffix = getSuffix();
      try {
        const res = await fetch(`/checkRemote${suffix}`);
        if (!res.ok) throw new Error(res.statusText);
        const latest = (await res.text()).trim();
        const cmp = window.FW_VERSION ? compareVersions(latest, window.FW_VERSION) : 1;
        if (cmp <= 0) {
          messageEl.textContent = 'Already on the latest firmware.';
        } else {
          newVerEl.textContent = latest;
          updateSect.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = 'Error checking update: ' + err.message;
        messageEl.classList.add('error');
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check for update';
      }
    });

    forceBtn.addEventListener('click', () => {
      resetUI();
      if (confirm('Please stay on this page during the update process. \n\n' +
                  'Force install the latest version?')) {
        newVerEl.textContent = 'latest';
        updateSect.style.display = 'block';
        performUpdate();
      }
    });

    updateBtn.addEventListener('click', () => {
      if (confirm('Please stay on this page during the update process.\n\n' +
                  'Update to version ' + newVerEl.textContent + '?')) {
        performUpdate();
      }
    });
  </script>
</body>
</html>
