<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EspressiScale Calibration</title>
<style>
  body {
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:#f2f2f5;color:#1c1c1e;
  }
  .card {
    background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1);
    padding:2rem;max-width:520px;width:90%;text-align:center;
  }
  h1 { font-size:1.75rem;margin-bottom:1rem;font-weight:600; }
  .msg {
    text-align:left;background:#f8f8fa;border:1px solid #e5e5ea;border-radius:12px;
    padding:1rem;line-height:1.45;font-size:.95rem;color:#3a3a3c;min-height:4.5rem;
    white-space:pre-wrap;
  }
  .btn {
    display:inline-flex;align-items:center;justify-content:center;width:100%;
    padding:.75rem 1.5rem;font-size:1rem;font-weight:500;color:#fff;background:#007aff;
    border:0;border-radius:24px;box-shadow:0 4px 12px rgba(0,122,255,.3);
    cursor:pointer;transition:background-color .2s, box-shadow .2s;margin-top:1rem;
  }
  .btn:hover { background:#005bb5;box-shadow:0 6px 16px rgba(0,91,181,.3); }
  .btn:disabled { background:#b0b0b5;box-shadow:none;cursor:default; }
  .note { font-size:.875rem;color:#6e6e73;margin-top:.75rem; }
  .err { color:#ff3b30; }
  .row { display:flex;gap:.5rem;justify-content:center;margin-top:1rem; }
  .linkbtn { background:transparent;color:#007aff;border:none;cursor:pointer;padding:.25rem .5rem;font-size:.95rem;border-radius:8px; }
  .linkbtn:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Calibration</h1>

    <div id="dialog" class="msg">Press <em>Calibrate</em> to begin.</div>

    <button id="actionBtn" class="btn">Calibrate</button>
    <div id="status" class="note"></div>

    <div class="row">
      <button class="linkbtn" onclick="location.href='/'">← Back to Home</button>
    </div>
  </div>

<script>
  const dialog  = document.getElementById('dialog');
  const statusE = document.getElementById('status');
  const btn     = document.getElementById('actionBtn');

  // 0 = initial, 1 = "Clear the scale", 2 = "Place 100g", 3 = starting calibration, 4 = complete
  let phase = 0;

  function setDialog(text) { dialog.textContent = text || ''; }
  function setStatus(text, isError=false) {
    statusE.textContent = text || '';
    statusE.className = 'note' + (isError ? ' err' : '');
  }
  function setBtn(label, disabled=false) {
    btn.textContent = label;
    btn.disabled = disabled;
  }

  function render() {
    switch (phase) {
      case 0:
        setDialog('Press Calibrate to begin.');
        setBtn('Calibrate', false);
        setStatus('');
        break;
      case 1:
        setDialog('Clear the scale');
        setBtn('Continue', false);
        setStatus('');
        break;
      case 2:
        setDialog('Place a 100g reference weight');
        setBtn('Start calibration', false);
        setStatus('');
        break;
      case 3:
        setDialog('Calibrating… Please wait.');
        setBtn('Calibrating…', true);
        break;
      case 4:
        setDialog('Calibration complete');
        setBtn('Done', false);
        setStatus('');
        break;
    }
  }

  async function callDoTare() {
    setBtn('Taring…', true);
    setStatus('');
    try {
      const res = await fetch('/doTare');      // Send tare request
      if (!res.ok) throw new Error('HTTP ' + res.status);
      phase = 2;                               // move to "Place 100g"
      render();
    } catch (e) {
      setStatus('Tare failed: ' + e.message, true);
      setBtn('Continue', false);               // allow retry
    }
  }

  async function callDoCalibration() {
    phase = 3; render();                       // show starting state
    setStatus('');
    try {
      const res = await fetch('/doCalibration'); // Send calibration request
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // Success → show complete + Done button
      phase = 4; render();
    } catch (e) {
      setStatus('Calibration failed: ' + e.message, true);
      phase = 2;                                // back to Start calibration
      setBtn('Start calibration', false);
    }
  }

  btn.addEventListener('click', () => {
    switch (phase) {
      case 0: phase = 1; render(); break;          // show "Clear the scale"
      case 1: callDoTare(); break;                 // calls /doTare, then shows "Place 100g"
      case 2: callDoCalibration(); break;          // calls /docalibration
      case 4: window.location.href = '/'; break;   // Done → home
    }
  });

  render(); // initial
</script>
</body>
</html>
