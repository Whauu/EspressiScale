<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EspressiScale Calibration</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/alpenkreuzer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* brewflow-ble coffee design language */
    --background: hsl(25 25% 8%);
    --card: hsl(25 20% 12%);
    --card-border: hsl(25 25% 20%);
    --foreground: hsl(0 0% 100%);
    --muted-foreground: hsl(0 0% 80%);
    --primary: hsl(25 40% 25%);
    --accent: hsl(20 85% 60%);
    --accent-soft: hsl(20 85% 60% / 0.18);
    --espresso: hsl(25 30% 5%);
    --danger: hsl(0 75% 55%);
    --radius: 0.75rem;
    --shadow-soft: 0 4px 20px hsl(0 0% 0% / 0.4);
    --shadow-scale: 0 8px 40px hsl(0 0% 0% / 0.5);
    --shadow-glow: 0 0 30px hsl(20 85% 60% / 0.4);
    --transition-spring: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 0%, hsl(20 85% 60% / 0.12), transparent 38%),
      radial-gradient(circle at 95% 90%, hsl(20 85% 60% / 0.09), transparent 35%),
      var(--background);
    color: var(--foreground);
    font-family: "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 1.5rem;
  }

  .card {
    width: min(560px, 100%);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: calc(var(--radius) * 1.5);
    box-shadow: var(--shadow-scale);
    padding: 2rem;
  }

  .brand {
    margin: 0;
    color: var(--muted-foreground);
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    font-family: "Alpenkreuzer", "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  h1 {
    margin: 0.35rem 0 1rem;
    font-size: 3rem;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .msg {
    text-align: left;
    background: var(--espresso);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 1rem;
    line-height: 1.5;
    font-size: 0.95rem;
    color: var(--foreground);
    min-height: 4.5rem;
    white-space: pre-wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent);
    color: var(--espresso);
    padding: 0.8rem 1.15rem;
    font-size: 0.97rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition-spring);
    box-shadow: var(--shadow-soft);
    margin-top: 1rem;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-glow);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .note {
    font-size: 0.9rem;
    color: var(--muted-foreground);
    margin-top: 0.7rem;
  }

  .err { color: var(--danger); }

  .inline {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-top: 1.4rem;
  }

  label {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted-foreground);
    font-weight: 600;
  }

  select {
    width: 100%;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--espresso);
    color: var(--foreground);
    padding: 0.65rem 0.9rem;
    font-size: 0.95rem;
    outline: none;
  }

  .row {
    display: flex;
    justify-content: center;
    margin-top: 0.9rem;
  }

  .linkbtn {
    background: transparent;
    color: var(--muted-foreground);
    border: none;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    font-size: 0.93rem;
    border-radius: 8px;
    transition: color 0.2s ease;
  }

  .linkbtn:hover {
    color: var(--foreground);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">EspressiScale</p>
    <h1>Calibration</h1>

    <div id="dialog" class="msg">Press <em>Calibrate</em> to begin.</div>

    <button id="actionBtn" class="btn">Calibrate</button>
    <div id="status" class="note"></div>

    <div class="inline">
      <label for="referenceSelect">Reference weight</label>
      <select id="referenceSelect">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </div>

    <div class="row">
      <button class="linkbtn" onclick="location.href='/'">← Back to Home</button>
    </div>
  </div>

<script>
  const dialog = document.getElementById('dialog');
  const statusE = document.getElementById('status');
  const btn = document.getElementById('actionBtn');
  const referenceSelect = document.getElementById('referenceSelect');

  let phase = 0;

  function setDialog(text) { dialog.textContent = text || ''; }
  function setStatus(text, isError=false) {
    statusE.textContent = text || '';
    statusE.className = 'note' + (isError ? ' err' : '');
  }
  function setBtn(label, disabled=false) {
    btn.textContent = label;
    btn.disabled = disabled;
  }

  function getSuffix() {
    const val = referenceSelect.value;
    if (val === '50' || val === '100' || val === '200') {
      return val;
    }
    return '100';
  }

  function render() {
    switch (phase) {
      case 0:
        setDialog('Press Calibrate to begin.');
        setBtn('Calibrate', false);
        setStatus('');
        break;
      case 1:
        setDialog('Clear the scale');
        setBtn('Continue', false);
        setStatus('');
        break;
      case 2:
        setDialog(`Place a ${getSuffix()} reference weight`);
        setBtn('Start calibration', false);
        setStatus('');
        break;
      case 3:
        setDialog('Calibrating… Please wait.');
        setBtn('Calibrating…', true);
        break;
      case 4:
        setDialog('Calibration complete');
        setBtn('Done', false);
        setStatus('');
        break;
    }
  }

  async function callDoTare() {
    setBtn('Taring…', true);
    setStatus('');
    try {
      const res = await fetch('/doTare');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      phase = 2;
      render();
    } catch (e) {
      setStatus('Tare failed: ' + e.message, true);
      setBtn('Continue', false);
    }
  }

  async function callDoCalibration() {
    phase = 3;
    render();
    setStatus('');
    const suffix = getSuffix();
    try {
      const res = await fetch(`/doCalibration${suffix}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      phase = 4;
      render();
    } catch (e) {
      setStatus('Calibration failed: ' + e.message, true);
      phase = 2;
      setBtn('Start calibration', false);
    }
  }

  btn.addEventListener('click', () => {
    switch (phase) {
      case 0:
        phase = 1;
        render();
        break;
      case 1:
        callDoTare();
        break;
      case 2:
        callDoCalibration();
        break;
      case 4:
        window.location.href = '/';
        break;
    }
  });

  render();
</script>
</body>
</html>
