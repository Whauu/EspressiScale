<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EspressiScale Calibration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

  :root {
    --bg: #f7f4ef;
    --panel: #ffffff;
    --panel-border: #eadfd3;
    --text: #2f2922;
    --muted: #8b7f73;
    --accent: #D95B29;
    --accent-hover: #bf4c1e;
    --danger: #d7263d;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fefcf9 0%, #f7f4ef 100%);
    color: var(--text);
    font-family: "Lato", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 1.5rem;
  }

  .card {
    width: min(560px, 100%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    box-shadow: 0 18px 40px rgba(73, 51, 29, 0.1);
    padding: 2rem;
  }

  .brand {
    margin: 0 0 0.65rem;
    display: inline-flex;
    align-items: center;
  }

  .brand img {
    display: block;
    width: min(320px, 100%);
    height: auto;
    border-radius: 6px;
  }

  h1 {
    margin: 0 0 1rem;
    font-size: 1.7rem;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .msg {
    text-align: left;
    background: #fff8f5;
    border: 1px solid #f1c7b5;
    border-radius: 14px;
    padding: 1rem;
    line-height: 1.5;
    font-size: 0.95rem;
    color: var(--text);
    min-height: 4.5rem;
    white-space: pre-wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    padding: 0.8rem 1.15rem;
    font-size: 0.97rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px rgba(217, 91, 41, 0.25);
    margin-top: 1rem;
  }

  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .note {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 0.7rem;
  }

  .err { color: var(--danger); }

  .inline {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-top: 1.4rem;
  }

  label {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
  }

  select {
    width: 100%;
    border-radius: 999px;
    border: 1px solid #d9cbbb;
    background: #fff;
    color: var(--text);
    padding: 0.65rem 0.9rem;
    font-size: 0.95rem;
    outline: none;
  }

  .row {
    display: flex;
    justify-content: center;
    margin-top: 0.9rem;
  }

  .linkbtn {
    background: transparent;
    color: #8f3b1b;
    border: none;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    font-size: 0.93rem;
    border-radius: 8px;
  }

  .linkbtn:hover {
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">
      <img src="/espressiscale-logo.svg" alt="EspressiScale logo">
    </p>
    <h1>Calibration</h1>

    <div id="dialog" class="msg">Press <em>Calibrate</em> to begin.</div>

    <button id="actionBtn" class="btn">Calibrate</button>
    <div id="status" class="note"></div>

    <div class="inline">
      <label for="referenceSelect">Reference weight</label>
      <select id="referenceSelect">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </div>

    <div class="row">
      <button class="linkbtn" onclick="location.href='/'">← Back to Home</button>
    </div>
  </div>

<script>
  const dialog = document.getElementById('dialog');
  const statusE = document.getElementById('status');
  const btn = document.getElementById('actionBtn');
  const referenceSelect = document.getElementById('referenceSelect');

  let phase = 0;

  function setDialog(text) { dialog.textContent = text || ''; }
  function setStatus(text, isError=false) {
    statusE.textContent = text || '';
    statusE.className = 'note' + (isError ? ' err' : '');
  }
  function setBtn(label, disabled=false) {
    btn.textContent = label;
    btn.disabled = disabled;
  }

  function getSuffix() {
    const val = referenceSelect.value;
    if (val === '50' || val === '100' || val === '200') {
      return val;
    }
    return '100';
  }

  function render() {
    switch (phase) {
      case 0:
        setDialog('Press Calibrate to begin.');
        setBtn('Calibrate', false);
        setStatus('');
        break;
      case 1:
        setDialog('Clear the scale');
        setBtn('Continue', false);
        setStatus('');
        break;
      case 2:
        setDialog(`Place a ${getSuffix()} reference weight`);
        setBtn('Start calibration', false);
        setStatus('');
        break;
      case 3:
        setDialog('Calibrating… Please wait.');
        setBtn('Calibrating…', true);
        break;
      case 4:
        setDialog('Calibration complete');
        setBtn('Done', false);
        setStatus('');
        break;
    }
  }

  async function callDoTare() {
    setBtn('Taring…', true);
    setStatus('');
    try {
      const res = await fetch('/doTare');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      phase = 2;
      render();
    } catch (e) {
      setStatus('Tare failed: ' + e.message, true);
      setBtn('Continue', false);
    }
  }

  async function callDoCalibration() {
    phase = 3;
    render();
    setStatus('');
    const suffix = getSuffix();
    try {
      const res = await fetch(`/doCalibration${suffix}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      phase = 4;
      render();
    } catch (e) {
      setStatus('Calibration failed: ' + e.message, true);
      phase = 2;
      setBtn('Start calibration', false);
    }
  }

  btn.addEventListener('click', () => {
    switch (phase) {
      case 0:
        phase = 1;
        render();
        break;
      case 1:
        callDoTare();
        break;
      case 2:
        callDoCalibration();
        break;
      case 4:
        window.location.href = '/';
        break;
    }
  });

  render();
</script>
</body>
</html>
